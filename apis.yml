aid: streamkap
url: https://raw.githubusercontent.com/api-evangelist/streamkap/refs/heads/main/apis.yml
name: Streamkap
kind: company
description: Streamkap is a real-time streaming ETL and change data capture (CDC)
  platform built on Apache Kafka and Apache Flink. It streams data from operational
  databases (PostgreSQL, MySQL, MongoDB, SQL Server, Oracle) to cloud warehouses,
  lakes, and other destinations with sub-second latency, and its REST API lets teams
  provision and operate sources, destinations, pipelines, transforms, and Kafka
  access programmatically.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Streaming
- ETL
- CDC
- Kafka
- Flink
- Data Integration
- Real Time
